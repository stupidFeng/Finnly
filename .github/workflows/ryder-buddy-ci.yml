name: RyderBuddy CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ryder-buddy/**'
      - '.github/workflows/ryder-buddy-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ryder-buddy/**'
      - '.github/workflows/ryder-buddy-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ryder-buddy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyderBuddy-debug-apk
          path: ryder-buddy/app/build/outputs/apk/debug/*.apk
